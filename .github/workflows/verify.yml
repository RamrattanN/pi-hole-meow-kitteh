name: verify
on:
  push:
    branches: [main, develop]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 scripts/build.py --check
      - run: python3 scripts/build_runner.py --check
      - run: sh -n run.sh
      - run: python3 -m unittest discover -s tests -v
      - run: node --check preview/demo.js
